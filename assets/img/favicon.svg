<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B1E2B" />
      <stop offset="100%" stop-color="#58141F" />
    </linearGradient>
  </defs>
  <!-- Background with subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#D4B996" stroke-width="2" />
  <!-- AC Monogram (Crisp, High-Contrast, Tab-Optimized) -->
